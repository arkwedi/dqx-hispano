name: Daily DQX ES sync

on:
  schedule:
    # 08:00 UTC daily -- adjust to whenever your PC is reliably on.
    # (Chile is UTC-3/UTC-4 depending on DST, so this is roughly 04-05 AM local.
    #  Change the cron if you'd rather it run at a time you're actually awake
    #  to check the review CSV.)
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed to publish the nightly Release

jobs:
  sync:
    runs-on: self-hosted   # your own PC, registered as a runner for this repo
    environment: DATABASE_URL
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Estos dos pasos van DESPUES del checkout a proposito: actions/checkout
      # limpia archivos no versionados del workspace, asi que si "cached_etp"
      # se crea antes, el checkout lo borra sin avisar y actions/cache no
      # tiene nada que subir al final del job.
      - name: Cache de etp.exe (para el runner de respaldo, NO publico)
        # actions/cache guarda esto dentro de la infraestructura de Actions,
        # no como asset descargable del repo -- evita redistribuir la
        # herramienta de terceros publicamente. Si actualizas la version de
        # etp.exe, sube el numero en la key (etp-exe-v1 -> v2) para forzar
        # que se vuelva a guardar.
        uses: actions/cache@v4
        with:
          path: cached_etp
          key: etp-exe-v1

      - name: Copiar etp.exe al cache si todavia no esta
        shell: powershell
        run: |
          if (-not (Test-Path "cached_etp\etp.exe")) {
            New-Item -ItemType Directory -Force -Path cached_etp | Out-Null
            Copy-Item "${{ vars.ETP_EXE_PATH }}" "cached_etp\etp.exe" -Force
            Write-Host "etp.exe copiado al cache (primera vez o key nueva)"
          } else {
            Write-Host "etp.exe ya estaba en cache, no se toca"
          }

      # --- Paso para instalar librerías necesarias de Python ---
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: psycopg2-binary

      - name: Run pipeline (etp.exe -> Supabase -> ETP -> clpk + paste_in_dqxclarity.zip)
        shell: powershell
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ETP_EXE_PATH: ${{ vars.ETP_EXE_PATH }}
          ETP_WORK_DIR: ${{ vars.ETP_WORK_DIR }}
          CLARITY_GLOSSARY_DB_PATH: ${{ vars.CLARITY_GLOSSARY_DB_PATH }}
          CLARITY_DIALOG_DB_PATH: ${{ vars.CLARITY_DIALOG_DB_PATH }}
        run: ./run_daily_pipeline.ps1

      - name: Build espanol.clpk from common.zip
        if: success()
        shell: powershell
        run: >
          python scripts/build_clpk.py "${{ vars.ETP_WORK_DIR }}/etp_output/common.zip"
          --output "${{ vars.ETP_WORK_DIR }}/etp_output/espanol.clpk"
          --author "dqx-hispano"
          --language es
          --download-url "https://github.com/${{ github.repository }}/releases/download/nightly/espanol.clpk"

      - name: Upload review CSV and Clarity DBs as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqx-es-sync-${{ github.run_id }}
          path: |
            ${{ vars.ETP_WORK_DIR }}/logs/*.csv
            ${{ vars.ETP_WORK_DIR }}/clarity_dbs/glossary.db
            ${{ vars.ETP_WORK_DIR }}/clarity_dbs/clarity_dialog.db
          if-no-files-found: ignore

      - name: Publish nightly Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Build nocturno (auto-generado)"
          body: "Ultima corrida exitosa del pipeline: ${{ github.run_id }}, ${{ github.event.repository.updated_at }}"
          prerelease: true
          files: |
            ${{ vars.ETP_WORK_DIR }}/etp_output/espanol.clpk
            ${{ vars.ETP_WORK_DIR }}/etp_output/paste_in_dqxclarity.zip
            ${{ vars.ETP_WORK_DIR }}/etp_output/readme.md

      # Publica el snapshot EN + etp/rps de ESTA corrida exitosa como un
      # release interno separado ("source-cache"). El workflow de
      # respaldo (daily_sync_fallback.yml) descarga esto cuando la PC
      # esta apagada, en vez de correr etp.exe all/port-translations.
      # softprops/action-gh-release reemplaza el asset previo solo,
      # asi que este release siempre tiene "la ultima copia buena".
      - name: Publish source cache (uso interno, para runs de respaldo)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: source-cache
          name: "Snapshot de origen (uso interno, no borrar)"
          body: "Snapshot valido mas reciente: run ${{ github.run_id }}"
          prerelease: true
          make_latest: false
          files: ${{ vars.ETP_WORK_DIR }}/source_cache.zip
